<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIN Checker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.wrapper {
  width: 420px;
  background: #111a2e;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h2 {
  margin: 0;
  font-size: 22px;
}

.header p {
  font-size: 13px;
  opacity: 0.7;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

.result {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #0f2f1c;
  border: 1px solid #22c55e;
}

.error {
  background: #2a1212;
  border: 1px solid #ef4444;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="header">
    <h2>TIN Verification System</h2>
    <p>Check your Tax Identification Number instantly</p>
  </div>

  <input type="text" id="tinInput" placeholder="Enter TIN number">
  <button onclick="checkTIN()">Verify</button>

  <div id="result" class="result"></div>
</div>

<script>
async function checkTIN() {
  const tin = document.getElementById("tinInput").value.trim();

  console.log("Entered TIN:", tin);

  const resultBox = document.getElementById("result");

  try {
    const res = await fetch("data.json");
    const data = await res.json();

    console.log("Loaded JSON data:", data);

    // ✅ Normalize helper
    const normalize = (v) => String(v).trim();

    // ✅ Correct matching logic for string array
    const found = data.find(item =>
      normalize(item) === normalize(tin)
    );

    console.log("Matched record:", found);

    resultBox.style.display = "block";

    if (found) {
      resultBox.className = "result success";
      resultBox.innerHTML = `
        <strong>✅ TIN Found</strong><br>
        ${found}
      `;
    } else {
      resultBox.className = "result error";
      resultBox.innerText = "❌ TIN not found";
    }

  } catch (error) {
    console.log("Error:", error);

    resultBox.style.display = "block";
    resultBox.className = "result error";
    resultBox.innerText = "Error loading data.json";
  }
}

</script>

</body>
</html>
